<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <!-- Background: medium-purple rounded square matching reference -->
  <rect width="56" height="56" rx="12" fill="#6B6CF5"/>
  <!-- Paper plane pointing upper-left (Lucide Send icon, mirrored horizontally, scaled to 38x38 with 9px padding) -->
  <!-- Original Send (upper-right): M22 2L15 22L11 13L2 9L22 2Z  mirrored (upper-left): M2 2L9 22L13 13L22 9L2 2Z -->
  <path
    transform="translate(9,9) scale(1.583)"
